name = "weiqi-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "GameRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Keep global fetch on public Internet egress; do not route user-supplied hosts to zone origins.
compatibility_flags = ["global_fetch_strictly_public"]
